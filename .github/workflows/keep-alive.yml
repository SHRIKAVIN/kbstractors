name: Keep Supabase Database Active

on:
  schedule:
    # Frequent pings (Supabase free tier pauses on long inactivity; GitHub may delay schedules slightly off-peak)
    # Cron: every 15 minutes UTC — ~96 runs/day
    - cron: '*/15 * * * *'
  workflow_dispatch: # Allows manual triggering from GitHub Actions UI

jobs:
  ping-database:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Keep-Alive Endpoint
        env:
          # Set this in GitHub Secrets: Settings > Secrets and variables > Actions
          # Add a secret named: VERCEL_DEPLOYMENT_URL
          # Value: https://your-app.vercel.app (your actual Vercel URL)
          VERCEL_URL: ${{ secrets.VERCEL_DEPLOYMENT_URL || 'https://kbstractors.vercel.app/' }}
        run: |
          CLEAN_VERCEL_URL="${VERCEL_URL%/}"
          KEEP_ALIVE_URL="${CLEAN_VERCEL_URL}/api/keep-alive"
          
          echo "🚀 Pinging keep-alive endpoint: $KEEP_ALIVE_URL"
          echo "⏰ Timestamp: $(date -u +"%Y-%m-%d %H:%M:%S UTC")"
          
          # Use -L to follow redirects (handles 308, 301, 302, etc.)
          # Use -f to fail silently on HTTP errors (we'll check status code manually)
          response=$(curl -sL -w "\n%{http_code}" "$KEEP_ALIVE_URL" --max-time 30)
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          
          echo "📊 HTTP Status Code: $http_code"
          echo "📝 Response: $body"
          
          if [ "$http_code" -eq 200 ]; then
            echo "✅ Keep-alive successful! Database is active."
            exit 0
          else
            echo "❌ Keep-alive failed with status code: $http_code"
            echo "⚠️  Please check your Vercel deployment and API endpoint."
            exit 1
          fi

      - name: Notify Teams on Success
        if: success()
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: |
          LOGO_URL="https://kbstractors.vercel.app/icons/kbs-tractors-192.png"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          payload=$(cat <<EOF
          {
            "@type": "MessageCard",
            "@context": "https://schema.org/extensions",
            "summary": "Supabase keep-alive success",
            "themeColor": "2EB886",
            "title": "Supabase Keep-Alive Notification",
            "sections": [
              {
                "activityTitle": "KBS EARTHMOVERS",
                "activitySubtitle": "Keep-alive workflow result",
                "activityImage": "${LOGO_URL}",
                "facts": [
                  { "name": "Project Name", "value": "KBS EARTHMOVERS" },
                  { "name": "Job Status", "value": "Success ✅" },
                  { "name": "Timestamp", "value": "$(date -u +"%Y-%m-%d %H:%M:%S UTC")" },
                  { "name": "Action", "value": "${{ github.workflow }}" },
                  { "name": "Job Number", "value": "#${{ github.run_number }}" }
                ],
                "markdown": true
              }
            ],
            "potentialAction": [
              {
                "@type": "OpenUri",
                "name": "Open GitHub Run",
                "targets": [
                  { "os": "default", "uri": "${RUN_URL}" }
                ]
              }
            ]
          }
          EOF
          )

          curl -sS -X POST "$TEAMS_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$payload"

      - name: Notify Teams on Failure
        if: failure()
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: |
          LOGO_URL="https://kbstractors.vercel.app/icons/kbs-tractors-192.png"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          payload=$(cat <<EOF
          {
            "@type": "MessageCard",
            "@context": "https://schema.org/extensions",
            "summary": "Supabase keep-alive failure",
            "themeColor": "E81123",
            "title": "Supabase Keep-Alive Notification",
            "sections": [
              {
                "activityTitle": "KBS EARTHMOVERS",
                "activitySubtitle": "Keep-alive workflow result",
                "activityImage": "${LOGO_URL}",
                "facts": [
                  { "name": "Project Name", "value": "KBS EARTHMOVERS" },
                  { "name": "Job Status", "value": "Failed ❌" },
                  { "name": "Timestamp", "value": "$(date -u +"%Y-%m-%d %H:%M:%S UTC")" },
                  { "name": "Action", "value": "${{ github.workflow }}" },
                  { "name": "Job Number", "value": "#${{ github.run_number }}" }
                ],
                "markdown": true
              }
            ],
            "potentialAction": [
              {
                "@type": "OpenUri",
                "name": "Open GitHub Run",
                "targets": [
                  { "os": "default", "uri": "${RUN_URL}" }
                ]
              }
            ]
          }
          EOF
          )

          curl -sS -X POST "$TEAMS_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$payload"
